# mARC — per-repo team binding (generated by /marc:init; edit freely).
# Schema: docs/team.toml.example. Standard TOML; inline comments are fine.
# HARD RULE: keep every key name unique across the whole file — the plugin's
# zero-dependency shell snippets extract values by key name alone.

[github]
gh_org = "NexaDuo"
gh_repo = "NexaDuo/revezo"
# The GitHub Project (v2) number that is the team's source-of-truth board.
project_number = 3
project_title = "revezo"

[architecture]
agents_doc = "AGENTS.md"

[paths]
app_paths = ["src/"]
iac_paths = ["supabase/migrations/", ".github/workflows/"]
test_paths = ["tests/"]
ui_paths = ["src/components/", "src/index.css", "tailwind.config.js"]

[validation]
# The single command that proves a change works:
validation_command = "npm run build && npx playwright test"
# Optional smoke/health entrypoint:
health_check_command = "npm run preview"

[release]
# true/false; if false, mandatory release phases are N/A.
has_release_pipeline = "true"
# Public URLs to validate against.
real_urls = ["https://nexaduo.com/revezo/"]
# Deploy model: push to main -> .github/workflows/deploy.yml builds and publishes
# dist/ to GitHub Pages. No staging environment exists; main IS production.
release_notes = "TODO_confirm_or_refine"
