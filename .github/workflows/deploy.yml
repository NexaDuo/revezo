name: Deploy to GitHub Pages

# Um workflow só para banco e site, em série: build -> migrate -> deploy.
# O bundle só vai para o Pages depois que as migrações do Supabase foram
# aplicadas, e a migração só roda se o build passou (senão o banco ficaria
# migrado com o bundle antigo no ar). Antes eram dois workflows independentes
# no mesmo push, e uma migração que falhava deixava no ar um app lendo
# colunas que não existiam.
#
# `migrate` roda em todo push para main. Sem migração nova, `supabase db push`
# não faz nada ("Remote database is up to date") e o deploy segue normal.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  migrate:
    # Banco de produção: só a partir de main, nunca de um dispatch em outra branch.
    if: github.ref == 'refs/heads/main'
    # Build quebrado não migra o banco.
    needs: build
    runs-on: ubuntu-latest
    # Só lê o repositório; nada de pages/id-token neste job.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.117.0

      # A senha vai só por env: a CLI lê SUPABASE_DB_PASSWORD (viper com
      # prefixo SUPABASE + AutomaticEnv), sem aparecer na linha de comando.
      - name: Link and push migrations
        run: |
          supabase link --project-ref pqjwzladsiktzttejcmp
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    # Migração falhou (ou foi pulada fora de main)? O site não sai.
    needs: migrate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
